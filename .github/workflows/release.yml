name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-linux-windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/frontend/package-lock.json

      - name: Build frontend
        working-directory: web/frontend
        run: |
          npm ci
          npm run build

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: false

      - name: Install cross-compilers
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu gcc-mingw-w64-x86-64

      - name: Build Linux amd64
        run: CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o dist/docker-panel-linux-amd64 .

      - name: Build Linux arm64
        run: CC=aarch64-linux-gnu-gcc CGO_ENABLED=1 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o dist/docker-panel-linux-arm64 .

      - name: Build Windows amd64
        run: CC=x86_64-w64-mingw32-gcc CGO_ENABLED=1 GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o dist/docker-panel-windows-amd64.exe .

      - name: Create archives
        run: |
          cd dist
          tar czf docker-panel-linux-amd64.tar.gz docker-panel-linux-amd64
          tar czf docker-panel-linux-arm64.tar.gz docker-panel-linux-arm64
          zip docker-panel-windows-amd64.zip docker-panel-windows-amd64.exe

      - name: Generate checksums
        working-directory: dist
        run: sha256sum docker-panel-* > checksums.txt

      - uses: actions/upload-artifact@v5
        with:
          name: linux-windows-artifacts
          path: dist/

  release-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/frontend/package-lock.json

      - name: Build frontend
        working-directory: web/frontend
        run: |
          npm ci
          npm run build

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: false

      - name: Build macOS arm64 (native)
        run: CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o dist/docker-panel-darwin-arm64 .

      - name: Build macOS amd64 (cross)
        run: CGO_ENABLED=1 GOOS=darwin GOARCH=amd64 CC="clang -arch x86_64" go build -ldflags="-s -w" -o dist/docker-panel-darwin-amd64 .

      - name: Create archives
        run: |
          cd dist
          tar czf docker-panel-darwin-arm64.tar.gz docker-panel-darwin-arm64
          tar czf docker-panel-darwin-amd64.tar.gz docker-panel-darwin-amd64

      - name: Generate checksums
        working-directory: dist
        run: shasum -a 256 docker-panel-* > checksums.txt

      - uses: actions/upload-artifact@v5
        with:
          name: macos-artifacts
          path: dist/

  release-create:
    runs-on: ubuntu-latest
    needs: [release-linux-windows, release-macos]
    steps:
      - uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: dist/

      - name: Consolidate artifacts
        run: |
          mkdir -p artifacts
          cp dist/linux-windows-artifacts/* artifacts/
          cp dist/macos-artifacts/* artifacts/
          cat artifacts/checksums.txt > artifacts/checksums-combined.txt 2>/dev/null || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          body_path: .github/release-template.md
          fail_on_unmatched_files: true
          files: |
            artifacts/docker-panel-linux-amd64.tar.gz
            artifacts/docker-panel-linux-arm64.tar.gz
            artifacts/docker-panel-darwin-amd64.tar.gz
            artifacts/docker-panel-darwin-arm64.tar.gz
            artifacts/docker-panel-windows-amd64.zip
            artifacts/checksums.txt
